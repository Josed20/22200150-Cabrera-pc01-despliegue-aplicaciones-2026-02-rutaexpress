services:

  # ── Base de datos PostgreSQL ────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: rutaexpress_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "15432:5432"      # accesible desde DBeaver en localhost:15432
    volumes:
      - postgres_data:/var/lib/postgresql/data   # persistencia de datos
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Réplica 1 ───────────────────────────────────────────────
  app1:
    build: .
    image: ${DOCKER_IMAGE:-envios-app:latest}
    container_name: rutaexpress_app1
    restart: unless-stopped
    environment:
      INSTANCE_ID:     app1
      PORT:            3000
      DB_HOST:         db
      DB_PORT:         5432
      DB_NAME:         ${POSTGRES_DB}
      DB_USER:         ${POSTGRES_USER}
      DB_PASSWORD:     ${POSTGRES_PASSWORD}
      SIMULATE_DELAY:  ${SIMULATE_DELAY:-false}
    depends_on:
      db:
        condition: service_healthy
    # Puerto 3000 NO se publica al host (solo accesible via Nginx)

  # ── Réplica 2 ───────────────────────────────────────────────
  app2:
    build: .
    image: ${DOCKER_IMAGE:-envios-app:latest}
    container_name: rutaexpress_app2
    restart: unless-stopped
    environment:
      INSTANCE_ID:     app2
      PORT:            3000
      DB_HOST:         db
      DB_PORT:         5432
      DB_NAME:         ${POSTGRES_DB}
      DB_USER:         ${POSTGRES_USER}
      DB_PASSWORD:     ${POSTGRES_PASSWORD}
      SIMULATE_DELAY:  ${SIMULATE_DELAY:-false}
    depends_on:
      db:
        condition: service_healthy

  # ── Réplica 3 ───────────────────────────────────────────────
  app3:
    build: .
    image: ${DOCKER_IMAGE:-envios-app:latest}
    container_name: rutaexpress_app3
    restart: unless-stopped
    environment:
      INSTANCE_ID:     app3
      PORT:            3000
      DB_HOST:         db
      DB_PORT:         5432
      DB_NAME:         ${POSTGRES_DB}
      DB_USER:         ${POSTGRES_USER}
      DB_PASSWORD:     ${POSTGRES_PASSWORD}
      SIMULATE_DELAY:  ${SIMULATE_DELAY:-false}
    depends_on:
      db:
        condition: service_healthy

  # ── Nginx (punto de entrada) ────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: rutaexpress_nginx
    restart: unless-stopped
    ports:
      - "8080:80"         # host:8080 → nginx:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx               # persistencia de logs de rechazos
    depends_on:
      - app1
      - app2
      - app3

volumes:
  postgres_data:    # datos de PostgreSQL (persisten al recrear contenedores)
  nginx_logs:       # logs de Nginx (incluye registros de HTTP 429)
