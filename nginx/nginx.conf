worker_processes auto;

events {
    worker_connections 1024;
}

http {

    # ── Zona de límite de velocidad (rate limiting) ────────────
    # 2 solicitudes por segundo por IP en POST /envios
    limit_req_zone $binary_remote_addr zone=envios_limit:10m rate=2r/s;

    # ── Formato de log personalizado (incluye datos para auditoría) ──
    log_format audit '$remote_addr - $time_iso8601 "$request" '
                     '$status $body_bytes_sent '
                     '"$http_user_agent" upstream="$upstream_addr"';

    # Log de acceso con formato audit
    access_log /var/log/nginx/access.log audit;
    # Log de errores (incluirá los 429)
    error_log  /var/log/nginx/error.log warn;

    # ── Upstream: balanceo round-robin entre las 3 réplicas ───
    upstream envios_backend {
        server app1:3000;
        server app2:3000;
        server app3:3000;
    }

    server {
        listen 80;
        server_name _;

        # ── POST /envios con rate limiting ─────────────────────
        location = /envios {
            limit_except POST GET {
                deny all;
            }

            # Límite: 2 req/s por IP, ráfaga de 4 solicitudes (nodelay = inmediatas)
            limit_req zone=envios_limit burst=4 nodelay;

            # Log personalizado para rechazos 429
            limit_req_status 429;

            proxy_pass         http://envios_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # ── Otras rutas sin límite de velocidad ────────────────
        location / {
            proxy_pass         http://envios_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
    }
}
