worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Mapeo para limitar únicamente solicitudes POST ───────────
    # Si el método no es POST, la variable queda vacía y Nginx no aplica límite
    map $request_method $limit_post_envios {
        POST    $binary_remote_addr;
        default "";
    }

    # ── Zona de límite: 2 solicitudes por segundo por IP ─────────
    limit_req_zone $limit_post_envios zone=envios_post_limit:10m rate=2r/s;

    # ── Formato de log de auditoría (sin datos sensibles ni body) ─
    # Registra: IP cliente, fecha y hora, método, ruta, código HTTP
    log_format audit '$remote_addr - [$time_iso8601] "$request_method $uri" '
                     'status=$status bytes=$body_bytes_sent '
                     'upstream=$upstream_addr req_time=$request_time';

    access_log /var/log/nginx/access.log audit;
    error_log  /var/log/nginx/error.log warn;

    # ── Upstream: balanceo round-robin entre las 3 réplicas ───────
    upstream envios_backend {
        server app1:3000 max_fails=3 fail_timeout=5s;
        server app2:3000 max_fails=3 fail_timeout=5s;
        server app3:3000 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name _;

        # ── Endpoint POST /envios con rate limit y ráfaga de 4 ──────
        location = /envios {
            # Límite de 2 req/s + ráfaga de 4 inmediatas (nodelay)
            limit_req zone=envios_post_limit burst=4 nodelay;
            limit_req_status 429;

            proxy_pass         http://envios_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ── Otras rutas (/health, /intentos, etc.) sin límite ──────
        location / {
            proxy_pass         http://envios_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
